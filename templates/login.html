<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Bus tracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--bg-2); border: 1px solid var(--bg-3);
    border-radius: var(--radius); padding: 28px;
  }
  .login-card h1 { font-size: 20px; margin-bottom: 6px; }
  .login-card p  { color: var(--fg-muted); font-size: 14px; margin: 0 0 20px; }
  .login-card label {
    display: block; font-size: 12px; color: var(--fg-muted);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
  }
  .login-card input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--bg-3); border-radius: 10px;
  }
  .login-card button {
    margin-top: 16px; width: 100%; padding: 14px;
    border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #0f172a;
    font-size: 16px; font-weight: 700;
  }
  .err {
    color: var(--bad); background: rgba(248,113,113,.12);
    padding: 10px 12px; border-radius: 8px; font-size: 13px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post" action="/login">
    <h1>🚌 Bus tracker</h1>
    <p>Sign in to view the school dashboard.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="key">School key</label>
    <input id="key" name="key" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
