services:
  - type: web
    name: bus-tracker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 30"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SCHOOL_KEY
        generateValue: true      # Render generates a random 64-char value
      - key: SESSION_SECRET
        generateValue: true
      - key: AT_USERNAME
        sync: false              # you'll paste these in the dashboard
      - key: AT_API_KEY
        sync: false
      - key: PARENT_AMANI_PHONE
        sync: false
